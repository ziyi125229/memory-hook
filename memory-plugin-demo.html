<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Hook</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --bg-2: #efeee9;
      --panel: #ffffff;
      --line: rgba(30, 30, 28, 0.08);
      --text: #1c1c1a;
      --muted: #8a8780;
      --accent: #2f2e2b;
      --accent-soft: #f0efeb;
      --user: #eceae4;
      --ai: #ffffff;
      --ok: #2f6b4f;
      --warn: #9a5b1a;
      --shadow: 0 8px 28px rgba(28, 28, 26, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
    }
    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 120px;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 620;
      letter-spacing: 0.02em;
    }
    .header .claim {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .header .slogan {
      margin: 6px 0 0;
      font-size: 15px;
      color: var(--text);
    }
    .stage {
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px 18px 12px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }
    .thread {
      flex: 1;
      overflow-y: auto;
      max-height: 52vh;
      padding: 4px 4px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .empty-hint {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      padding: 40px 12px;
    }
    .empty-hint .try-label {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .chip:hover {
      background: var(--accent-soft);
      border-color: #d5d1c8;
    }
    .answer-card .evidence {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
    }
    .answer-card .evidence .meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .msg {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 92%;
      animation: fadeUp 0.28s ease;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.ai { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      border: 1px solid var(--line);
    }
    .msg.user .bubble {
      background: var(--user);
      border-radius: 18px 18px 6px 18px;
    }
    .msg.ai .bubble {
      background: var(--ai);
      border-radius: 18px 18px 18px 6px;
    }
    .memory-card, .state-diff, .clarify-card, .answer-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      min-width: 220px;
    }
    .memory-card .title, .state-diff .title, .clarify-card .title, .answer-card .title {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .memory-card .row, .state-diff .row {
      font-size: 14px;
      line-height: 1.7;
    }
    .state-diff .arrow {
      margin: 8px 0;
      font-size: 14px;
      color: var(--text);
    }
    .state-diff .muted { color: var(--muted); font-size: 13px; }
    .clarify-card {
      border-color: rgba(154, 91, 26, 0.25);
      background: #fffaf4;
    }
    .evidence {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .composer {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .composer-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .composer input[type="text"] {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      color: var(--text);
    }
    .composer input[type="text"]:focus {
      border-color: #c9c5bc;
      box-shadow: 0 0 0 4px rgba(47,46,43,0.06);
    }
    .composer button {
      height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-send {
      background: var(--accent);
      color: #faf9f6;
    }
    .btn-mic {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line) !important;
      min-width: 48px;
    }
    .btn-mic.listening {
      background: #7f1d1d;
      color: #fecaca;
      border-color: #991b1b !important;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .voice-draft {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .voice-draft.active { display: block; }
    .voice-draft .hint {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .voice-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-voice-retry {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line) !important;
    }
    .btn-voice-confirm {
      background: var(--accent);
      color: #faf9f6;
    }
    .error {
      min-height: 1.2em;
      margin: 8px 2px 0;
      color: var(--warn);
      font-size: 13px;
    }
    .shelf {
      margin-top: 22px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 18px;
    }
    .shelf h2 {
      margin: 0 0 12px;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-weight: 600;
    }
    .shelf-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .shelf-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .shelf-item .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }
    .shelf-item .meta { color: var(--muted); font-size: 12px; }
    .shelf-item .loc { color: var(--muted); margin-top: 4px; font-size: 13px; }
    .shelf-empty { color: var(--muted); font-size: 14px; }
    .shelf details {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .shelf summary { cursor: pointer; }
    .hist-list {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .hist-item {
      opacity: 0.72;
      background: #faf9f6;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      50% { filter: brightness(1.15); }
    }
    @media (max-width: 560px) {
      .page { padding: 28px 14px 100px; }
      .msg { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Memory Hook</h1>
      <p class="claim">你的 AI 个人记忆助手</p>
      <p class="slogan">你只管说，我帮你记。</p>
    </header>

    <section class="stage">
      <div class="thread" id="thread">
        <div class="empty-hint" id="emptyHint">
          <p class="try-label">试试：</p>
          <div class="chips" id="exampleChips">
            <button type="button" class="chip" data-text="我把红色钥匙放到客厅茶几下面抽屉里了。">记住我的钥匙</button>
            <button type="button" class="chip" data-text="我把钥匙拿到玄关柜了。">更新物品位置</button>
            <button type="button" class="chip" data-text="我的钥匙在哪？">我的钥匙在哪？</button>
          </div>
        </div>
      </div>

      <form class="composer" id="form">
        <div class="composer-row">
          <input id="memory" type="text" placeholder="说点什么，或问我：我的钥匙在哪？" autocomplete="off" />
          <button type="button" class="btn-mic" id="mic" title="语音输入">🎙</button>
          <button type="submit" class="btn-send" id="btnSend">发送</button>
        </div>
        <div class="voice-draft" id="voiceDraft">
          <p class="hint">语音识别结果已填入输入框，可先编辑再确认发送。</p>
          <div class="voice-actions">
            <button type="button" class="btn-voice-retry" id="voiceRetry">重新录音</button>
            <button type="button" class="btn-voice-confirm" id="voiceConfirm">确认发送</button>
          </div>
        </div>
        <p class="error" id="error"></p>
      </form>
    </section>

    <section class="shelf">
      <h2>MEMORY SHELF · CURRENT</h2>
      <ul class="shelf-list" id="shelfCurrent"></ul>
      <p class="shelf-empty" id="shelfEmpty">还没有当前记忆。</p>
      <details id="shelfHistoryWrap">
        <summary id="shelfHistorySummary">查看历史</summary>
        <ul class="hist-list" id="shelfHistory"></ul>
      </details>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "memory-hook-v16";
    const CONFIDENCE_OK = 0.75;
    const ROOMS = ["客厅", "卧室", "玄关", "厨房", "书房", "卫生间", "阳台", "餐厅"];
    const FURNITURE = ["床头柜", "电视柜", "玄关柜", "茶几", "书桌", "鞋柜", "沙发", "柜子", "桌子", "床", "抽屉"];
    const SYN_GROUPS = [
      ["耳机", "airpods", "airpod", "earpods", "earphone"],
      ["充电宝", "移动电源"],
      ["钥匙", "钥匙串"],
    ];

    let memories = loadMemories();

    function uid() {
      return "m_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function loadMemories() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
    }

    function cleanText(text) {
      return String(text || "")
        .trim()
        .replace(/[。！？!?，,]/g, (ch) => (ch === "，" || ch === "," ? "，" : ""));
    }

    function stripFillers(s) {
      return s
        .replace(/放到了/g, "放到")
        .replace(/放在了/g, "放在")
        .replace(/拿到了/g, "拿到")
        .replace(/我借给/g, "借给")
        .replace(/顺手把/g, "把")
        .replace(/刚才又把/g, "把")
        .replace(/后来(我)?把/g, "把")
        .replace(/^(昨晚|昨天晚上|昨天|今天)?(回家后)?[，,\s]*/g, "")
        .replace(/^(我刚刚|刚刚|我刚才|刚才|后来|我)/g, "")
        .replace(/^的/, "")
        .replace(/那串/g, "")
        .trim();
    }

    const COLORS = ["黑色", "银色", "红色", "白色", "金色", "蓝色", "绿色", "灰色"];
    const VAGUE_OBJECT = /^(它|这个|那个|东西|那个东西|这个东西|某[个件]东西)$/;
    const PLACE_VERB = String.raw`(?:扔(?:到|进|在)?|塞(?:到|进|在)?|搁(?:到|在)?|拿到|拿去|又放到|又放在|放到|放在|放这儿|放)`;

    function cleanObject(s) {
      return String(s || "")
        .replace(/昨天(晚上)?买的/g, "")
        .replace(/买的/g, "")
        .replace(/那[个件]/g, "")
        .replace(/这[个件]/g, "")
        .replace(/刚刚|顺手|刚才|后来/g, "")
        .replace(/都$/g, "")
        .replace(/我的/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function splitObjects(raw) {
      const s = cleanObject(raw).replace(/都$/g, "").trim();
      if (!s) return [];
      if (/[和跟与]/.test(s)) {
        return s.split(/[和跟与]/).map((x) => cleanObject(x)).filter(Boolean);
      }
      return [s];
    }

    function isVagueObject(s) {
      const t = cleanObject(s).replace(/\s/g, "");
      if (!t) return true;
      if (VAGUE_OBJECT.test(t)) return true;
      if (/^(东西应该还|那个东西|这个东西)$/.test(t)) return true;
      return false;
    }

    function isVagueLocation(s) {
      const t = String(s || "").trim().replace(/^的/, "");
      if (!t || t === "地方") return true;
      return /(昨天|以前|原来|某个|老的?).{0,8}地方/.test(s) || /某个地方/.test(t);
    }

    function truncateLocation(raw) {
      let s = String(raw || "").trim();
      s = s.split(/免得|以免|不然|所以|于是/)[0];
      s = s.replace(/那个/g, "的");
      s = s.replace(/里面/g, "");
      s = s.replace(/[里上中了]+$/g, "");
      s = s.replace(/[，,。]+$/g, "");
      return s.trim();
    }

    function colorOf(s) {
      const t = String(s || "");
      return COLORS.find((c) => t.includes(c)) || null;
    }

    function parseLocation(raw) {
      if (!raw) return null;
      const cut = truncateLocation(raw);
      if (!cut || isVagueLocation(cut)) return { raw: cut, hierarchy: [], vague: isVagueLocation(cut || raw) };
      let s = cut;
      const hierarchy = [];
      const furn = [...FURNITURE].sort((a, b) => b.length - a.length);
      const rooms = [...ROOMS].sort((a, b) => b.length - a.length);
      for (const item of furn) {
        if (s.includes(item)) {
          hierarchy.push(item);
          s = s.replace(item, "");
        }
      }
      for (const room of rooms) {
        if (s.includes(room)) {
          hierarchy.unshift(room);
          s = s.replace(room, "");
        }
      }
      s = s.replace(/^[的]/, "").replace(/下面|下方/g, (m, _i, str) => (str.includes("抽屉") ? "" : m)).trim();
      s = s.replace(/^的/, "").replace(/[上里中了]/g, " ").replace(/\s+/g, "").trim();
      if (/下面|下方/.test(cut) && /抽屉/.test(cut) && !hierarchy.some((h) => h.includes("抽屉"))) {
        const drawer = (cut.match(/(右边|最右边)?第?[一二三四五六七八九十0-9]*[层个]?抽屉/) || ["抽屉"])[0];
        hierarchy.push(drawer);
      } else if (s) {
        const rest = s.replace(/^的/, "").replace(/^(下面|下方)的?/, "");
        if (rest && !hierarchy.includes(rest)) hierarchy.push(rest);
      }
      if (!hierarchy.length) hierarchy.push(cut);
      return { raw: cut, hierarchy, vague: false };
    }

    function locationText(loc) {
      if (!loc) return "";
      if (loc.hierarchy && loc.hierarchy.length) return loc.hierarchy.join("");
      return loc.raw || "";
    }

    function locationPath(loc) {
      if (!loc) return "";
      if (loc.hierarchy && loc.hierarchy.length) return loc.hierarchy.join(" > ");
      return loc.raw || "";
    }

    function locationAnswer(loc) {
      if (!loc) return "";
      const raw = (loc.raw || locationText(loc)).replace(/了$/g, "").replace(/[里上中]$/g, "");
      return raw;
    }

    function detectPerson(s) {
      const m = s.match(/借给([^了放在到]+?)了?$/);
      return m ? m[1].replace(/^了/, "").trim() : null;
    }

    // Parsing Layer：规则解析，失败则退回 general
    let currentState = {};
    const STATE_EVENTS = ["place", "move", "lend", "return", "possession_transfer"];

    function makeMemory(base, extra) {
      return { ...base, id: uid(), ...extra };
    }

    function finishPossession(base, objectRaw, personRaw) {
      const objects = splitObjects(objectRaw);
      const person = String(personRaw || "")
        .replace(/了$/g, "")
        .replace(/^的/, "")
        .trim();
      if (!person || !objects.length || objects.every(isVagueObject)) {
        return [makeMemory(base, { type: "general", uncertain: true, confidence: 0.2, source: "rule" })];
      }
      return objects
        .filter((o) => !isVagueObject(o))
        .map((object) =>
          makeMemory(base, {
            type: "possession",
            object,
            person,
            event: "possession_transfer",
            status: "with_person",
            location: null,
            uncertain: false,
            confidence: 0.92,
            source: "rule",
          })
        );
    }

    function parseMemories(originalText) {
      const original = originalText.trim();
      let s = stripFillers(original.replace(/[。！？!?]/g, ""));
      s = s
        .replace(/放到了/g, "放到")
        .replace(/放在了/g, "放在")
        .replace(/拿到了/g, "拿到")
        .replace(/我借给/g, "借给")
        .replace(/钥匙后来放/g, "钥匙放");
      const now = new Date().toISOString();
      const base = {
        type: "general",
        object: null,
        location: null,
        person: null,
        event: null,
        status: null,
        timestamp: now,
        originalText: original,
        isCurrent: false,
        supersededBy: null,
        supersedes: null,
        uncertain: false,
        confidence: 0.3,
        source: "rule",
      };

      const finishPlace = (objectRaw, locRaw, event, extra) => {
        const location = parseLocation(locRaw);
        const objects = splitObjects(objectRaw);
        if (
          !objects.length ||
          objects.every(isVagueObject) ||
          (location && location.vague) ||
          isVagueLocation(locRaw)
        ) {
          return [makeMemory(base, { type: "general", uncertain: true, confidence: 0.2, source: "rule" })];
        }
        return objects
          .filter((o) => !isVagueObject(o))
          .map((object) =>
            makeMemory(base, {
              type: (extra && extra.type) || "location",
              object,
              location,
              person: extra && extra.person ? extra.person : null,
              event,
              status: (extra && extra.status) || "stored",
              uncertain: false,
              confidence: 0.92,
              source: "rule",
            })
          );
      };

      const returned =
        s.match(/把(.+?)还给.+?(?:放在|放到|放)(.+)/) ||
        s.match(/(.+?)把(.+?)还给.+?(?:放在|放到|放)(.+)/);
      if (returned && /还给/.test(s)) {
        const objectRaw = returned.length === 4 ? returned[2] : returned[1];
        return finishPlace(objectRaw, returned[returned.length - 1], "return");
      }

      const move = s.match(/把(.+?)从(.+?)(?:拿出来)?(?:再)?(?:拿到|放到|放在|放)(.+?)了?$/);
      if (move) return finishPlace(move[1], move[3], "move");

      const lend1 = s.match(/把(.+?)借给(.+?)了?$/);
      const lend2 = s.match(/(.+?)借给(.+?)了?$/);
      const lend = lend1 || lend2;
      if (lend && /借给/.test(s) && !/还给/.test(s)) {
        const objects = splitObjects(lend[1]);
        const person = lend[2].replace(/了$/g, "").trim();
        if (!objects.length || objects.every(isVagueObject)) {
          return [makeMemory(base, { uncertain: true, confidence: 0.2, source: "rule" })];
        }
        return objects.map((object) =>
          makeMemory(base, {
            type: "lending",
            object,
            person,
            event: "lend",
            status: "lent",
            confidence: 0.93,
            source: "rule",
          })
        );
      }

      // possession transfer：拿走 ≠ 借给
      // 小王把充电宝拿走了
      const takeByAgent = s.match(/^(.+?)把(.+?)拿走了?$/);
      if (takeByAgent && !/借给/.test(s)) {
        return finishPossession(base, takeByAgent[2], takeByAgent[1]);
      }
      // 护照被妈妈拿走了
      const takePassive = s.match(/^(.+?)被(.+?)拿走了?$/);
      if (takePassive && !/借给/.test(s)) {
        return finishPossession(base, takePassive[1], takePassive[2]);
      }
      // 妈妈拿走我的护照了 / 妈妈拿走护照了
      const takeActive = s.match(/^(.+?)拿走(?:了)?(?:我的)?(.+?)了?$/);
      if (takeActive && !/借给/.test(s) && !/^把/.test(s)) {
        return finishPossession(base, takeActive[2], takeActive[1]);
      }

      if (/在哪|借给谁|什么了|哪些/.test(s)) {
        return [makeMemory(base, { confidence: 0.3, source: "rule" })];
      }

      const placePatterns = [
        new RegExp("把(.+?)" + PLACE_VERB + "(.+?)了?$"),
        new RegExp("(.+?)" + PLACE_VERB + "(.+?)了?$"),
        /(.+?)在(?!哪)(.+)$/,
      ];
      for (const re of placePatterns) {
        const m = s.match(re);
        if (m) return finishPlace(m[1], m[2], "place");
      }

      return [makeMemory(base, { confidence: 0.3, source: "rule" })];
    }

    function parseMemory(originalText) {
      return parseMemories(originalText)[0];
    }

    // AI Understanding Layer：预留 LLM 接口，不在前端放 Key。
    // Frontend → API Route / Serverless → LLM → Structured JSON
    async function parseMemoryWithAI(_text) {
      return null;
    }

    function validateMemories(list, originalText) {
      return (list || []).map((m) => {
        const copy = { ...m, originalText: m.originalText || originalText, source: m.source || "ai" };
        if (isVagueObject(copy.object) || isVagueLocation((copy.location && copy.location.raw) || "")) {
          copy.uncertain = true;
          copy.confidence = Math.min(copy.confidence || 0.2, 0.2);
        }
        if (copy.confidence == null) copy.confidence = copy.uncertain ? 0.2 : 0.9;
        return copy;
      });
    }

    async function understandMemories(text) {
      try {
        const ai = await parseMemoryWithAI(text);
        if (ai && ai.length) return validateMemories(ai, text);
      } catch (_err) {
        /* fallback */
      }
      return parseMemories(text);
    }

    function objectsMatch(a, b) {
      if (!a || !b) return false;
      const x = String(a).toLowerCase().trim();
      const y = String(b).toLowerCase().trim();
      const cx = colorOf(x);
      const cy = colorOf(y);
      if (cx && cy && cx !== cy) return false;
      if (x === y) return true;
      if (x.includes(y) || y.includes(x)) return true;
      const gx = SYN_GROUPS.find((g) => g.some((w) => x.includes(w)));
      const gy = SYN_GROUPS.find((g) => g.some((w) => y.includes(w)));
      return Boolean(gx && gy && gx === gy);
    }

    function isStateEvent(m) {
      return Boolean(
        m &&
          m.object &&
          !m.uncertain &&
          !isVagueObject(m.object) &&
          (m.confidence == null || m.confidence >= CONFIDENCE_OK) &&
          STATE_EVENTS.includes(m.event)
      );
    }

    function findStateKey(object) {
      const hit = Object.keys(currentState).find((k) => {
        const st = currentState[k];
        return objectsMatch(k, object) || objectsMatch(st.object, object);
      });
      return hit || String(object).toLowerCase();
    }

    function getCurrentState(object) {
      if (!object || isVagueObject(object)) return null;
      const entries = Object.keys(currentState).map((k) => currentState[k]);
      const exact = entries.find((st) => String(st.object).toLowerCase() === String(object).toLowerCase());
      if (exact) return exact;
      const colorHits = entries.filter((st) => objectsMatch(st.object, object));
      if (colorHits.length === 1) return colorHits[0];
      if (colorHits.length > 1 && colorOf(object)) {
        return colorHits.find((st) => colorOf(st.object) === colorOf(object)) || null;
      }
      if (colorHits.length > 1 && !colorOf(object)) return null;
      return colorHits[0] || null;
    }

    function historyForObject(object, exceptId) {
      return memories
        .filter((m) => m.object && objectsMatch(m.object, object) && m.id !== exceptId)
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    }

    function resolveStates() {
      currentState = {};
      memories.forEach((m) => {
        m.isCurrent = false;
        if (m.supersededBy === undefined) m.supersededBy = null;
        if (m.supersedes === undefined) m.supersedes = null;
      });
      const ordered = [...memories]
        .filter(isStateEvent)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      for (const m of ordered) {
        const key = findStateKey(m.object);
        const prev = currentState[key];
        if (prev) {
          m.supersedes = prev.memoryId;
          const prevMem = memories.find((x) => x.id === prev.memoryId);
          if (prevMem) {
            prevMem.isCurrent = false;
            prevMem.supersededBy = m.id;
          }
        }
        m.isCurrent = true;
        currentState[key] = {
          object: m.object,
          location: m.location,
          person: m.event === "lend" || m.event === "possession_transfer" ? m.person : null,
          event: m.event,
          status: m.status,
          memoryId: m.id,
          updatedAt: m.timestamp,
        };
      }
    }

    resolveStates();

    function formatClock(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function relativeTime(iso) {
      const ms = Date.now() - new Date(iso).getTime();
      const min = Math.floor(ms / 60000);
      if (min < 1) return "刚刚";
      if (min < 60) return min + " 分钟前";
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + " 小时前";
      const day = Math.floor(hr / 24);
      return day + " 天前";
    }

    function isYesterday(iso, originalText) {
      if (/昨晚|昨天/.test(originalText || "")) return true;
      const d = new Date(iso);
      const y = new Date();
      y.setDate(y.getDate() - 1);
      return d.toDateString() === y.toDateString();
    }

    function isToday(iso) {
      return new Date(iso).toDateString() === new Date().toDateString();
    }

    function looksLikeQuery(text) {
      return /[？?]|在哪|在哪里|放哪|借给谁|借给别人|哪些|什么了|什么东西/.test(text);
    }

    function parseQuery(text) {
      let s = text.trim().replace(/[？?。！!]/g, "");
      const intent = {
        raw: s,
        event: null,
        object: null,
        locationHint: null,
        person: null,
        timeHint: null,
        focus: "current",
        intent: "current_location",
        wantWhere: false,
        wantWho: false,
        wantWhat: false,
        vague: false,
      };
      if (/以前|之前|原来|曾经/.test(s)) {
        intent.focus = "history";
        intent.intent = "historical_location";
      } else if (/昨天|昨晚/.test(s) && !/现在/.test(s)) {
        intent.focus = "yesterday";
        intent.intent = "time_location";
      } else if (/现在|目前|此刻|最后一次/.test(s)) {
        intent.focus = "current";
        intent.intent = "current_location";
      } else if (/刚才|刚刚/.test(s)) {
        intent.focus = "current";
        intent.intent = "current_location";
      }
      if (/昨晚|昨天/.test(s)) intent.timeHint = "yesterday";
      if (/今天/.test(s)) intent.timeHint = "today";
      if (/借给别人|借了什么|什么.*借|借出/.test(s) || /借给谁/.test(s)) {
        intent.event = "lend";
        intent.intent = "lending_person";
      }
      if (/借给谁/.test(s)) intent.wantWho = true;
      if (/什么了|哪些|什么东西/.test(s)) intent.wantWhat = true;
      if (/在哪|在哪里|放哪|放哪里|找一下|找到/.test(s)) {
        intent.wantWhere = true;
        if (!intent.event) intent.event = "place";
        if (!intent.intent) intent.intent = intent.focus === "history" ? "historical_location" : "current_location";
      }
      for (const room of ROOMS) {
        if (s.includes(room)) intent.locationHint = room;
      }
      for (const furn of FURNITURE) {
        if (s.includes(furn)) intent.locationHint = intent.locationHint || furn;
      }
      let obj = s
        .replace(/我的|我把/g, "")
        .replace(/在哪里|在哪儿|在哪|放哪里了|放哪了|放哪|放哪里/g, "")
        .replace(/借给(谁|别人).*/g, "")
        .replace(/什么东西|有哪些|哪些|什么了/g, "")
        .replace(/昨天晚上|昨天|昨晚|今天|回家后/g, "")
        .replace(/以前|之前|原来|曾经|现在|目前|刚才|刚刚|最后一次/g, "")
        .replace(/帮我找一下|找一下/g, "")
        .replace(/东西/g, "")
        .replace(/^我/, "")
        .replace(/^把/, "")
        .trim();
      obj = cleanObject(obj);
      if (isVagueObject(obj) || /^(那个|这个|它)$/.test(obj)) {
        intent.object = null;
        intent.vague = true;
      } else if (obj && obj.length <= 20) {
        intent.object = obj;
      }
      return intent;
    }

    function haystack(m) {
      return [
        m.object,
        m.person,
        m.originalText,
        locationText(m.location),
        locationPath(m.location),
        m.event,
        m.status,
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    }

    function scoreMemory(m, intent) {
      let score = 0;
      if (intent.object && m.object && objectsMatch(intent.object, m.object)) score += 40;
      if (intent.locationHint) {
        const blob = locationText(m.location) + (m.originalText || "");
        if (blob.includes(intent.locationHint)) score += 20;
      }
      if (intent.person && m.person && m.person.includes(intent.person)) score += 20;
      if (intent.event === "lend") {
        if (m.event === "lend" && m.status === "lent") score += 35;
        else score -= 15;
      }
      if (intent.event === "place" && (m.event === "place" || m.event === "move") && m.status === "stored") score += 12;
      if (intent.raw && m.originalText && m.originalText.includes(intent.raw)) score += 8;
      if (intent.object && m.originalText && objectsMatch(intent.object, m.originalText)) score += 10;
      if (m.isCurrent) score += 18;
      const hours = Math.max(0.1, (Date.now() - new Date(m.timestamp).getTime()) / 3600000);
      score += Math.min(8, 8 / hours);
      if (intent.timeHint === "yesterday" && isYesterday(m.timestamp, m.originalText)) score += 15;
      if (intent.timeHint === "today" && isToday(m.timestamp)) score += 10;
      if (intent.timeHint === "yesterday" && !isYesterday(m.timestamp, m.originalText)) score -= 8;
      return score;
    }

    const UNSURE = "我目前没有足够的信息确定它的位置。是哪一件物品？";
    const ASK_IT = "我可以帮你记，但你说的「它」是指哪件东西？";
    const ASK_THING = "我还不确定你指的是哪件东西。告诉我物品名称，我就能帮你记住。";

    function captureAsk(text) {
      if (/它/.test(text) && !/其它|其他/.test(text)) return ASK_IT;
      if (/那个东西|这个东西|昨天放的地方|某个地方/.test(text)) return ASK_THING;
      return ASK_THING;
    }

    function retrieve(query) {
      const intent = parseQuery(query);
      if (intent.vague || (intent.wantWhere && !intent.object && intent.event !== "lend")) {
        return { intent, results: [], current: null, history: [], unsure: true };
      }
      if (intent.focus === "history" && intent.object) {
        const hist = memories
          .filter((m) => m.object && objectsMatch(m.object, intent.object) && m.isCurrent === false)
          .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        return {
          intent,
          results: hist.slice(0, 3),
          current: getCurrentState(intent.object),
          history: hist,
        };
      }
      if (intent.focus === "yesterday" && intent.object) {
        const yest = memories
          .filter(
            (m) =>
              m.object &&
              objectsMatch(m.object, intent.object) &&
              isYesterday(m.timestamp, m.originalText)
          )
          .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        if (yest.length) {
          return { intent, results: [yest[0]], current: null, history: yest.slice(1) };
        }
      }
      if ((intent.wantWhere || intent.focus === "current") && intent.object) {
        const state = getCurrentState(intent.object);
        if (state) {
          const currentMem = memories.find((m) => m.id === state.memoryId);
          return {
            intent,
            results: currentMem ? [currentMem] : [],
            current: state,
            history: historyForObject(state.object || intent.object, state.memoryId),
          };
        }
      }
      if (intent.event === "lend" && !intent.object) {
        const lent = Object.values(currentState).filter((s) => s.status === "lent");
        const results = lent
          .map((s) => memories.find((m) => m.id === s.memoryId))
          .filter(Boolean);
        return { intent, results, current: lent[0] || null, history: [] };
      }
      const ranked = memories
        .filter((m) => !m.uncertain)
        .map((m) => ({ m, score: scoreMemory(m, intent) }))
        .filter((x) => x.score > 8)
        .sort((a, b) => b.score - a.score);
      return {
        intent,
        results: ranked.map((x) => x.m).slice(0, 5),
        current: intent.object ? getCurrentState(intent.object) : null,
        history: [],
      };
    }

    function answerFromState(state, fallbackObject, focus) {
      if (!state) return "";
      const obj = state.object || fallbackObject;
      const prefix = focus === "history" ? "以前" : "现在";
      if (state.status === "lent" && state.person) {
        return `你的${obj}${prefix}借给${state.person}了。`;
      }
      if ((state.status === "with_person" || state.event === "possession_transfer") && state.person) {
        return `你的${obj}${prefix}在${state.person}那里。`;
      }
      if (state.location) {
        return `你的${obj}${prefix}在${locationAnswer(state.location)}。`;
      }
      return "";
    }

    function makeAnswer(intent, results, current) {
      if (intent && intent.vague) {
        if (intent.raw && /它/.test(intent.raw) && !/其它|其他/.test(intent.raw)) return ASK_IT;
        return ASK_THING;
      }
      if (intent && intent.focus === "history") {
        if (results && results.length && results[0].location) {
          return `你的${results[0].object}以前在${locationAnswer(results[0].location)}。`;
        }
        if (current && current.location) {
          return "我目前只有当前位置，没有更早的历史记录。";
        }
        return intent.object ? `我目前没有记住${intent.object}以前的位置。` : UNSURE;
      }
      const state = current || (intent.object ? getCurrentState(intent.object) : null);
      const fromState = answerFromState(state, intent.object, intent.focus);
      if (fromState && intent.focus !== "history") return fromState;
      if (!results.length) {
        if (intent.object && (intent.wantWhere || intent.focus === "current")) {
          return `我目前没有记住${intent.object}的位置。`;
        }
        return intent.wantWhere ? UNSURE : "";
      }
      const m = results[0];
      if (m.uncertain || (m.confidence != null && m.confidence < CONFIDENCE_OK)) {
        if (m.object && m.location) {
          return `我记得你提过${m.object}可能在${locationAnswer(m.location)}，但这条记录不够确定。`;
        }
        return captureAsk(m.originalText || "");
      }
      if (intent.event === "lend" || intent.wantWho) {
        if (m.person && m.object) return `${m.object}借给了${m.person}。`;
      }
      if (m.type === "location" && m.object && m.location && !isVagueObject(m.object)) {
        return `你的${m.object}现在在${locationAnswer(m.location)}。`;
      }
      if (m.type === "lending" && m.object && m.person) {
        return `你的${m.object}现在借给${m.person}了。`;
      }
      if ((m.type === "possession" || m.event === "possession_transfer") && m.object && m.person) {
        return `你的${m.object}现在在${m.person}那里。`;
      }
      if (intent.wantWhere) {
        return intent.object ? `我目前没有记住${intent.object}的位置。` : UNSURE;
      }
      return "";
    }

    function objectEmoji(obj) {
      const s = String(obj || "");
      if (/钱包/.test(s)) return "👛";
      if (/充电宝|充电线/.test(s)) return "🔋";
      if (/耳机|AirPods|airpods/i.test(s)) return "🎧";
      if (/身份证/.test(s)) return "🪪";
      return "🔑";
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

      if (emptyHint && emptyHint.parentNode) emptyHint.remove();
    }

    function personLabel(m) {
      if (!m || !m.person) return "";
      if (m.status === "lent" || m.event === "lend" || m.type === "lending") {
        return `借给：${m.person}`;
      }
      if (m.status === "with_person" || m.event === "possession_transfer" || m.type === "possession") {
        return `在 ${m.person} 那里`;
      }
      return m.person;
    }

    function memoryCardHtml(m) {

      rows.push(`<div class="row">${objectEmoji(m.object)} ${escapeHtml(m.object)}</div>`);
      if (m.location) rows.push(`<div class="row">📍 ${escapeHtml(locationPath(m.location))}</div>`);
      if (m.person) rows.push(`<div class="row">👤 ${escapeHtml(personLabel(m))}</div>`);
      rows.push(`<div class="row">🕐 ${escapeHtml(relativeTime(m.timestamp) || "刚刚")}</div>`);
      return `<div class="memory-card"><div class="title">MEMORY</div>${rows.join("")}</div>`;

    function clarifyCardHtml(text) {
      // 单次 Clarify：一条 AI bubble + 一张 Clarify Card，不把同一句追问再写进卡片。
      return `<div class="bubble">${escapeHtml(text)}</div>

        </div>`;
    }

    function formatPersonLoc(memOrState) {
      if (!memOrState || !memOrState.person) return "";
      if (memOrState.status === "lent" || memOrState.event === "lend") return `借给${memOrState.person}`;
      if (memOrState.status === "with_person" || memOrState.event === "possession_transfer") {
        return `${memOrState.person}那里`;
      }
      return memOrState.person;
    }

    function stateDiffHtml(prev, next) {
      const oldLoc = prev && prev.location
        ? locationAnswer(prev.location)
        : prev && prev.person
        ? formatPersonLoc(prev)
        : "未知";
      const newLoc = next.location
        ? locationAnswer(next.location)
        : next.person
        ? formatPersonLoc(next)
        : "未知";
      const hist = historyForObject(next.object, next.id)
        .slice(0, 3)
        .map((h) => {
          const loc = h.location
            ? locationAnswer(h.location)
            : h.person
            ? formatPersonLoc(h)
            : "";
          return `<div class="muted">· ${escapeHtml(h.object)} → ${escapeHtml(loc)}</div>`;
        })
        .join("");
      return `<div class="bubble">好的，我更新了${escapeHtml(next.object)}的位置。</div>
        <div class="state-diff">
          <div class="title">STATE UPDATE</div>
          <div class="row">${escapeHtml(next.object)}</div>
          <div class="arrow">${escapeHtml(oldLoc)} → ${escapeHtml(newLoc)}</div>
          <div class="row"><strong>Current</strong> ${escapeHtml(next.object)} → ${escapeHtml(newLoc)}</div>
          <div class="muted" style="margin-top:8px">History</div>
          ${hist || `<div class="muted">· ${escapeHtml(next.object)} → ${escapeHtml(oldLoc)}</div>`}
        </div>`;
    }

    function answerBlockHtml(answer, evidenceMem) {
      let card = "";
      if (evidenceMem) {
        card = `<div class="answer-card">
          <div class="title">ANSWER</div>
          <div class="evidence">
            <div class="meta">最近记录 · ${escapeHtml(relativeTime(evidenceMem.timestamp))}</div>
            “${escapeHtml(evidenceMem.originalText)}”
          </div>
        </div>`;
      }
      return `<div class="bubble">${escapeHtml(answer)}</div>${card}`;
    }

    function findPrevStateSnapshot(object, snapshot) {
      if (!object || !snapshot) return null;
      const hit = Object.keys(snapshot).find((k) => {
        const st = snapshot[k];
        return objectsMatch(k, object) || objectsMatch(st.object, object);
      });
      return hit ? snapshot[hit] : null;
    }

    function renderShelf() {
      const currents = Object.values(currentState || {});
      const currentIds = new Set(currents.map((s) => s.memoryId));
      const currentMems = currents
        .map((s) => memories.find((m) => m.id === s.memoryId))
        .filter(Boolean)
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      const historyMems = memories
        .filter((m) => m.object && !m.uncertain && !currentIds.has(m.id))
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      shelfEmpty.style.display = currentMems.length ? "none" : "block";
      shelfCurrent.innerHTML = currentMems
        .map((m) => {
          const loc = m.location
            ? locationPath(m.location)
            : m.person
            ? formatPersonLoc(m)
            : "—";
          return `<li class="shelf-item">
            <div class="top"><span>${objectEmoji(m.object)} ${escapeHtml(m.object)}</span><span class="meta">${escapeHtml(relativeTime(m.timestamp))}</span></div>
            <div class="loc">${escapeHtml(loc)}</div>
          </li>`;
        })
        .join("");
      shelfHistorySummary.textContent = `查看历史（${historyMems.length}）`;
      shelfHistory.innerHTML = historyMems.length
        ? historyMems
            .map((m) => {
              const loc = m.location
                ? locationAnswer(m.location)
                : m.person
                ? formatPersonLoc(m)
                : "";
              return `<li class="hist-item">${escapeHtml(m.object)} → ${escapeHtml(loc)} · ${escapeHtml(relativeTime(m.timestamp))}</li>`;
            })
            .join("")
        : `<li class="hist-item">暂无历史记录</li>`;
    }

    function render() {
      renderShelf();
    }

    function runQuery(q) {
      appendUser(q);
      const { intent, results, current, history, unsure } = retrieve(q);
      const answer = makeAnswer(intent, results, current) || UNSURE;
      const evidence = results && results[0] ? results[0] : null;
      const isClarify =
        unsure ||
        intent.vague ||
        /哪一件|不确定|指的是/.test(answer);
      // 同一条输入只渲染一次：Clarify 走 clarifyCardHtml；否则走 Answer。
      if (isClarify && (!evidence || evidence.uncertain || intent.vague)) {
        appendAi(clarifyCardHtml(answer));
      } else {
        appendAi(answerBlockHtml(answer, evidence && !evidence.uncertain ? evidence : null));
      }
      render();
    }

    let submitting = false;
    let voiceDraftActive = false;

    const voiceDraft = document.getElementById("voiceDraft");
    const voiceRetryBtn = document.getElementById("voiceRetry");
    const voiceConfirmBtn = document.getElementById("voiceConfirm");
    const btnSend = document.getElementById("btnSend");

    function setVoiceDraftActive(on) {
      voiceDraftActive = Boolean(on);
      if (voiceDraft) voiceDraft.classList.toggle("active", voiceDraftActive);
    }

    function dismissVoiceDraft() {
      setVoiceDraftActive(false);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitting) return;
      errorEl.textContent = "";
      const text = input.value.trim();
      if (!text) {
        errorEl.textContent = "先说一句要记住的话，或问我一个问题。";
        return;
      }
      // 键盘/文本发送与「确认发送」共用此路径；进入理解前先关闭语音草稿态。
      dismissVoiceDraft();
      submitting = true;
      try {
        if (looksLikeQuery(text)) {
          input.value = "";
          runQuery(text);
          return;
        }

        appendUser(text);
        const beforeState = JSON.parse(JSON.stringify(currentState || {}));
        const list = await understandMemories(text);
        list.forEach((memory) => memories.unshift(memory));
        resolveStates();
        persist();
        input.value = "";

        const first = list[0];
        if (!first || first.uncertain || list.every((m) => m.uncertain || !m.object)) {
          appendAi(clarifyCardHtml(captureAsk(first && first.originalText)));
          render();
          return;
        }

        let diffShown = false;
        for (const m of list.filter((x) => x.object && !x.uncertain)) {
          const prev = findPrevStateSnapshot(m.object, beforeState);
          if (!prev) continue;
          const prevLoc = prev.location ? locationAnswer(prev.location) : "";
          const nextLoc = m.location ? locationAnswer(m.location) : "";
          const locChanged = prevLoc && nextLoc && prevLoc !== nextLoc;
          const personChanged =
            (prev.person || "") !== (m.person || "") ||
            (prev.status || "") !== (m.status || "");
          const lendChanged = prev.status !== m.status || prev.person !== m.person;
          if (locChanged || lendChanged || personChanged) {
            appendAi(stateDiffHtml(prev, m));
            diffShown = true;
            break;
          }
        }
        if (!diffShown) {
          const cards = list
            .filter((m) => m.object && !m.uncertain)
            .map(memoryCardHtml)
            .join("");
          appendAi(`<div class="bubble">好的，我记住了。</div>${cards}`);
        }
        render();
      } finally {
        submitting = false;
      }
    });

    document.getElementById("exampleChips")?.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const text = chip.getAttribute("data-text") || "";
      if (!text) return;
      dismissVoiceDraft();
      input.value = text;
      form.requestSubmit();
    });

    render();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;

    function startListening() {
      if (!recognition) return;
      try {
        recognition.start();
      } catch (err) {
        errorEl.textContent = "无法开始录音：" + err.message;
      }
    }

    function enterVoiceDraft(transcript) {
      input.value = transcript;
      setVoiceDraftActive(true);
      errorEl.textContent = "";
      input.focus();
      try {
        input.setSelectionRange(input.value.length, input.value.length);
      } catch (_e) {
        /* ignore */
      }
    }

    if (!SpeechRecognition) {
      micBtn.disabled = true;
      micBtn.title = "当前浏览器不支持 Web Speech API，请用 Chrome / Edge";
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "…";
        errorEl.textContent = "";
      };

      recognition.onresult = (event) => {
        let transcript = "";
        let allFinal = true;
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
          if (!event.results[i].isFinal) allFinal = false;
        }
        const text = transcript.trim();
        input.value = text;
        // 语音只写入 Composer Draft，不自动提交 / 不进入 Memory Understanding。
        if (allFinal && text) enterVoiceDraft(text);
      };

      recognition.onerror = (event) => {
        const map = {
          "not-allowed": "没有麦克风权限，请在浏览器设置里允许。",
          "no-speech": "没听到声音，请再说一次。",
          "audio-capture": "找不到麦克风。",
          "network": "语音识别需要网络，请检查连接。",
        };
        errorEl.textContent = map[event.error] || "语音识别失败：" + event.error;
      };

      recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎙";
      };

      micBtn.addEventListener("click", () => {
        if (!recognition) return;
        if (listening) {
          recognition.stop();
          return;
        }
        startListening();
      });

      voiceRetryBtn?.addEventListener("click", () => {
        // 重新录音：不产生 Memory，清空草稿后再次识别。
        input.value = "";
        dismissVoiceDraft();
        errorEl.textContent = "";
        if (listening && recognition) {
          try {
            recognition.stop();
          } catch (_e) {
            /* ignore */
          }
        }
        setTimeout(() => startListening(), 120);
      });

      voiceConfirmBtn?.addEventListener("click", () => {
        // 确认发送：以输入框当前（可编辑）文本作为最终输入。
        const text = input.value.trim();
        if (!text) {
          errorEl.textContent = "请先确认或编辑识别结果。";
          return;
        }
        form.requestSubmit();
      });
    }

    // 用户手动编辑后仍可用原「发送」；开始打字时保留草稿条直到发送/重录。
    input.addEventListener("input", () => {
      if (voiceDraftActive && !input.value.trim()) dismissVoiceDraft();
    });
  </script>
</body>
</html>
